services:
  registry:
    build:
      context: .
      dockerfile: Dockerfile
    image: anyclaw:prod
    container_name: anyclaw-registry
    restart: unless-stopped
    entrypoint: ["anyclaw-registry"]
    command:
      - serve
      - --addr
      - ${ANYCLAW_REGISTRY_ADDR:-:8791}
      - --data-dir
      - ${ANYCLAW_REGISTRY_DATA_DIR:-/data}
      - --db-driver
      - ${ANYCLAW_REGISTRY_DB_DRIVER:-sqlite}
      - --db-dsn
      - ${ANYCLAW_REGISTRY_DB_DSN:-/data/registry.db}
      - --admin-token
      - ${ANYCLAW_REGISTRY_ADMIN_TOKEN:?ANYCLAW_REGISTRY_ADMIN_TOKEN is required}
      - --require-admin-token=${ANYCLAW_REGISTRY_REQUIRE_ADMIN_TOKEN:-true}
      - --seed=${ANYCLAW_REGISTRY_SEED:-true}
    expose:
      - "8791"
    volumes:
      - registry-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8791/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: anyclaw:prod
    container_name: anyclaw-website
    restart: unless-stopped
    entrypoint: ["python3"]
    command:
      - /srv/static-spa-server.py
      - --port
      - "8080"
      - --directory
      - /site
      - --registry-target
      - http://registry:8791
    ports:
      - "80:8080"
    volumes:
      - ./site/dist:/site:ro
      - ./deploy/static-spa-server.py:/srv/static-spa-server.py:ro
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  anyclaw:
    image: anyclaw:prod
    container_name: anyclaw-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - anyclaw-data:/workspace/.anyclaw
      - ./workflows:/workspace/workflows
    environment:
      ANYCLAW_LLM_PROVIDER: ${ANYCLAW_LLM_PROVIDER:-openai}
      ANYCLAW_LLM_MODEL: ${ANYCLAW_LLM_MODEL:-gpt-4o}
      ANYCLAW_LLM_API_KEY: ${ANYCLAW_LLM_API_KEY}
      ANYCLAW_API_TOKEN: ${ANYCLAW_API_TOKEN}
      ANYCLAW_GATEWAY_HOST: ${ANYCLAW_GATEWAY_HOST:-0.0.0.0}
      ANYCLAW_GATEWAY_PORT: ${ANYCLAW_GATEWAY_PORT:-18789}
      ANYCLAW_MARKETPLACE_ENDPOINT: ${ANYCLAW_MARKETPLACE_ENDPOINT:-http://registry:8791}
      ANYCLAW_REGISTRY_TOKEN: ${ANYCLAW_REGISTRY_TOKEN}
      ANYCLAW_MARKETPLACE_DISABLE_REMOTE: ${ANYCLAW_MARKETPLACE_DISABLE_REMOTE:-false}
      ANYCLAW_MARKETPLACE_CACHE_TTL_SECONDS: ${ANYCLAW_MARKETPLACE_CACHE_TTL_SECONDS:-60}
      ANYCLAW_MARKETPLACE_REQUEST_TIMEOUT_SECONDS: ${ANYCLAW_MARKETPLACE_REQUEST_TIMEOUT_SECONDS:-30}
      ANYCLAW_MARKETPLACE_AUTO_INSTALL_SKILL: ${ANYCLAW_MARKETPLACE_AUTO_INSTALL_SKILL:-false}
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  registry-data:
  anyclaw-data:
